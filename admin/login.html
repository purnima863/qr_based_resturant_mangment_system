<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — FoodieHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/css/base.css">
<style>.wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#2b1e18,#5a2417)}
.box{width:min(400px,100%);padding:34px 28px}.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--gold));display:grid;place-items:center;color:#fff;font-size:1.5rem;margin:0 auto 14px}</style>
</head>
<body><div class="wrap"><div class="card box fade-up">
  <div class="logo"><i class="fa-solid fa-lock"></i></div>
  <h2 class="text-center" style="margin-bottom:4px">Admin Login</h2>
  <p class="muted small text-center" style="margin-bottom:22px">Authorised staff only</p>
  <form id="f" novalidate>
    <div class="field"><label>Username</label><input class="input" name="user" autocomplete="username"><small class="err"></small></div>
    <div class="field"><label>Password</label><input class="input" name="pass" type="password" autocomplete="current-password"><small class="err"></small></div>
    <button class="btn btn-primary btn-lg btn-block">Log in</button>
  </form></div></div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/common.js"></script>
<script>
if (sessionStorage.getItem('rqr_admin') === '1') location.replace('dashboard.html');
const f = $('#f'); Form.clearOnInput(f);
f.onsubmit = e => { e.preventDefault();
  const v = Form.validate(f, { user: v => v ? '' : 'Enter username', pass: v => v ? '' : 'Enter password' }); if (!v) return;
  if (v.user === ADMIN_LOGIN.username && v.pass === ADMIN_LOGIN.password) { sessionStorage.setItem('rqr_admin', '1'); location.href = 'dashboard.html'; }
  else Form.mark(f.elements.pass, 'Wrong username or password');
};
</script></body></html>
