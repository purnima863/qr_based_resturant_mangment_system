<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers — FoodieHub Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="toolbar">
        <div class="search grow"><i class="fa-solid fa-magnifying-glass"></i><input id="q" type="search" placeholder="Search by name, phone or email…"></div>
        <select class="select" id="filter">
          <option value="all">All customers</option><option value="repeat">Repeat (3+ orders)</option><option value="new">New (0–2 orders)</option><option value="vip">High value (₹5,000+)</option>
        </select>
        <select class="select" id="sort"><option value="spent">Sort: Top spenders</option><option value="orders">Sort: Most orders</option><option value="recent">Sort: Recent visit</option><option value="name">Sort: Name A–Z</option></select>
      </div>
      <div class="card panel flush">
        <div class="table-wrap"><table class="data"><thead><tr><th>Customer</th><th>Contact</th><th>Orders</th><th>Total spent</th><th>Last visit</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
      </div>
      <div class="pager" id="pager"></div>
    </main>
  </div>
</div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/common.js"></script>
<script src="js/admin-common.js"></script>
<script src="js/customers.js"></script>
</body>
</html>
