<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — FoodieHub Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="stat-grid" id="stats"></div>
      <div class="grid-2">
        <div class="card panel"><div class="panel-head"><h3>Sales — last 7 days</h3><span class="muted small">Paid revenue</span></div><div class="chart-box"><canvas id="c-sales"></canvas></div></div>
        <div class="card panel"><div class="panel-head"><h3>Orders by status</h3></div><div class="chart-box"><canvas id="c-status"></canvas></div></div>
      </div>
      <div class="grid-2e">
        <div class="card panel"><div class="panel-head"><h3>Revenue by category</h3></div><div class="chart-box sm"><canvas id="c-cat"></canvas></div></div>
        <div class="card panel"><div class="panel-head"><h3>Top selling items</h3></div><div class="chart-box sm"><canvas id="c-top"></canvas></div></div>
      </div>
      <div class="card panel flush">
        <div class="panel-head"><h3>Recent orders</h3><a class="btn btn-outline btn-sm" href="orders.html">View all</a></div>
        <div class="table-wrap" style="margin-top:14px"><table class="data"><thead><tr><th>Order</th><th>Customer</th><th>Table</th><th>Total</th><th>Time</th><th>Status</th></tr></thead><tbody id="recent"></tbody></table></div>
      </div>
    </main>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/common.js"></script>
<script src="js/admin-common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
